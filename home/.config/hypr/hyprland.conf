########################
### VARIABLES
########################

$mod = SUPER

$left  = h
$down  = j
$up    = k
$right = l

$term = kitty
$file_explorer = thunar
$browser = firefox


########################
### AUTOSTART
########################

# Top header bar
exec-once = waybar
# Wallpaper manager
exec-once = swww-daemon
# Clipboard manager
exec-once = copyq --start-server
# Hyprland package manager
exec-once = hyprpm reload -n
# Sleep manager
exec-once = hypridle &
# Keyring daemon
exec-once = gnome-keyring-daemon --start --components=secrets
# Auto suspend
exec-once = ~/.config/hypr/scripts/suspend.sh
# Set cursor theme
exec-once = hyprctl setcursor Bibata_Spirit 32


########################
### MONITORS
########################

monitor = ,preferred,auto,1


########################
### GENERAL LOOK & FEEL
########################

general {
    gaps_in = 10
    gaps_out = 10
    border_size = 1
    layout = dwindle
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, gnomed
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 8, myBezier
}

misc {
    animate_manual_resizes = 1   
}


########################
### DECORATION
########################

decoration {
    rounding = 6

    blur {
        enabled = true
        size = 2
        passes = 3
    }
}


########################
### COLORS
########################

# Focused border color
general {
    col.active_border = rgb(EFD24D)
    col.inactive_border = rgb(374d70)
}

########################
### INPUT
########################

input {
    follow_mouse = 0

    touchpad {
        disable_while_typing = true
        tap-to-click = true
        natural_scroll = true
        middle_button_emulation = true
    }
}


########################
### KEYBINDINGS
########################
# Apps
bind = $mod, Return, exec, $term
bind = $mod, e, exec, $file_explorer
bind = $mod, b, exec, $browser
bind = $mod, d, exec, rofi -show drun -show-icons

# Lock on lid close
bindl=,switch:off:Lid Switch, exec, hyprlock --immediate

# Kill window
bind = $mod, q, killactive

# Reload config
bind = $mod SHIFT, c, exec, hyprctl reload

# Exit Hyprland
bind = $mod SHIFT, e, exit

# Screenshots
bind = ,PRINT,exec,hyprshot -m region
bind = $mod,PRINT,exec,hyprshot -m window

# Lock screen
bind = $mod SHIFT CTRL, l, exec, hyprlock


########################
### WINDOW FOCUS
########################

bind = $mod, $left, movefocus, l
bind = $mod, $down, movefocus, d
bind = $mod, $up, movefocus, u
bind = $mod, $right, movefocus, r

bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r


########################
### MOVE WINDOWS
########################

bind = $mod SHIFT, $left, movewindow, l
bind = $mod SHIFT, $down, movewindow, d
bind = $mod SHIFT, $up, movewindow, u
bind = $mod SHIFT, $right, movewindow, r

bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r


########################
### WORKSPACES
########################

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, s, togglespecialworkspace

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, s, movetoworkspace, special


########################
### LAYOUT / FLOATING
########################

bind = $mod, f, fullscreen
bind = $mod SHIFT, space, togglefloating
bind = $mod, space, cyclenext
bind = $mod, a, focuswindow, prev

# Move/resize windows with $mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


########################
### RESIZE MODE
########################

bind = $mod, r, submap, resize

submap = resize
bind = , $left, resizeactive, -60 0
bind = , $right, resizeactive, 60 0
bind = , $up, resizeactive, 0 -60
bind = , $down, resizeactive, 0 60

bind = , Left, resizeactive, -60 0
bind = , Right, resizeactive, 60 0
bind = , Up, resizeactive, 0 -60
bind = , Down, resizeactive, 0 60

bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset


########################
### MEDIA KEYS
########################
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

bind = , Print, exec, grim
