general {
  disable_loading_bar = true
  hide_cursor = true
}

background {
  monitor =
  color = rgba(20,20,20,1.0)
}

input-field {
  monitor =
  size = 300, 35
  position = 0, -80
  dots_center = false
  dots_size = 0.33
  dots_spacing = 12
  fade_on_empty = true
  font_color = rgb(220,220,220)
  inner_color = rgba(40,40,40,1.0)
  outer_color = rgba(80,80,80,1.0)
  outline_thickness = 2
  shadow_passes = 2
}

label {
  monitor =
  text = Enter password:
  font_family = monospace
  font_size = 24
  color = rgb(200,200,200)
  position = 0, 0
  halign = center
  valign = center
}