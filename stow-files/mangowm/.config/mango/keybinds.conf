########################
### KEYBINDINGS
########################

# Apps
bind=SUPER,Return,spawn,ghostty
bind=SUPER,e,spawn,thunar
bind=SUPER,b,spawn,firefox
bind=SUPER,d,spawn,rofi -show drun -show-icons

# Reload config
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,c,reload_config

# Lock on lid close
switchbind=fold,spawn,swaylock -f

# Kill window
bind=SUPER,q,killclient

# Exit mango
bind=SUPER+SHIFT,e,quit

# Screenshots
bind=NONE,Print,spawn,grimshot copy area
bind=SUPER,Print,spawn,grimshot copy active

# Lock screen
bind=SUPER+SHIFT+CTRL,l,spawn,swaylock -f

########################
### WINDOW FOCUS
########################

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

########################
### MOVE WINDOWS
########################

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

########################
### WORKSPACES / TAGS
########################

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Scratchpad
bind=SUPER,s,toggle_scratchpad
bind=SUPER+SHIFT,s,minimized

########################
### LAYOUT / FLOATING
########################

bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,space,focusstack,next

# Move/resize windows with SUPER + mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

########################
### RESIZE
########################

bind=SUPER+CTRL,h,resizewin,-60,0
bind=SUPER+CTRL,l,resizewin,60,0
bind=SUPER+CTRL,k,resizewin,0,-60
bind=SUPER+CTRL,j,resizewin,0,60

bind=SUPER+CTRL,Left,resizewin,-60,0
bind=SUPER+CTRL,Right,resizewin,60,0
bind=SUPER+CTRL,Up,resizewin,0,-60
bind=SUPER+CTRL,Down,resizewin,0,60

########################
### MEDIA KEYS
########################

bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
