# Plugins
set -g @plugin 'tmux-plugins/tpm'

# Vim-tmux navigator (manual bindings for extended-keys compatibility)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Remap prefix from 'C-b' to '`'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g focus-events on
set -g status-style "bg=default,fg=#a89984"
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify centre

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Enable Vi keys
set-window-option -g mode-keys vi

# Setup 'v' to begin selection and 'y' to yank (copy)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" # or xclip

# Move between panes using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l

# Resize panes with arrow keys
bind -n M-Left resize-pane -L 5
bind -n M-Down resize-pane -D 5
bind -n M-Up resize-pane -U 5
bind -n M-Right resize-pane -R 5

# Don't rename windows automatically
set-option -g allow-rename off

# Enable mouse control
set -g mouse on

# Start window indexing at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Turn on Xterm Keys for modifier keys pass through
set -s extended-keys on
set -ag terminal-features ',xterm*:extkeys'
set -g allow-passthrough on

# Allow-passthrough for advanced features
set-option -g allow-passthrough on

######################
# VISUAL CUSTOMISATION
######################

# Disable bell feedback
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

### STATUS BAR ###
set -g status-position bottom
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left "#[bg=#fabd2f,fg=#282828,bold]   #{session_group} #[bg=#b8bb26,fg=#fabd2f]#[bg=#b8bb26,fg=#282828]#{?client_prefix, PREFIX ,}#[bg=#3c3836,fg=#b8bb26]"
set -g status-left-length 500
set -g window-status-format "#[bg=#3c3836,fg=#a89984] #{window_index}-#{window_name} #{?#{==:#{window_index},#{last_window_index}},#[bg=#282828 fg=#3c3836],}"
set -g window-status-current-format "#[bg=#504945,fg=#3c3836]#[fg=#fabd2f,bold] #{window_index}-#{window_name} #[bg=#3c3836,fg=#504945]#{?#{==:#{window_index},#{last_window_index}},#[bg=#282828],}"
set -g window-status-separator ""
set -g status-right "#[fg=#3c3836,bg=#282828]#[bg=#3c3836,fg=#a89984] #(date +%a-%b-%d) \
#[fg=#fabd2f]#[bg=#fabd2f,fg=#282828,bold] #(date +%H:%M) "
set -g status-right-length 500
set -g status-interval 1

### PANES ###
set -g pane-base-index 1
set -g pane-border-format "#{?pane_active,\
╡#[fg=#282828 bg=#fabd2f]  #{pane_index}-#{pane_current_command}  #[fg=#fabd2f bg=default]╞,\
╡#[fg=#a89984 bg=default]  #{pane_index}-#{pane_current_command}  #[fg=#a89984]╞}"
set -g pane-border-lines double
set -g pane-border-status 'top'
set -g pane-border-style fg=#504945
set -g pane-active-border-style fg=#fabd2f
